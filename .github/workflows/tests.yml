name: tests

# Runs the parts of `scripts/run_tests.sh` that do not need a real desktop:
#   - node syntax checks on content.js / gemini.js
#   - manifest.json validity
#   - gemini.js paste/submit against the headless DOM mock
#   - the real unpacked extension end-to-end via puppeteer-core
#   - the hermetic Linux orchestrator tests (shimmed ydotool/xclip/gdbus)
#   - the log analyzer's failure-mode classification (tests/test_analyze_log.py)
#   - the rate guard (fixture-driven; floors the per-target success rate)
#
# Deliberately NOT run: the full-system test (tests/e2e/run_full_system.mjs)
# needs Wayland + ydotoold + a headful browser, and the macOS drift check
# (Mac/check_live_sync.sh) needs the live ~/.hammerspoon/init.lua. Both SKIP
# cleanly here; see the "macOS drift check in CI" issue.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The e2e test loads the unpacked extension, and branded Google Chrome
      # removed --load-extension (crbug 401529219) — it would silently never
      # load. Chrome for Testing still honors it and is the build meant for
      # automation, so install that instead of google-chrome-stable.
      # --path matters: without it the installer drops the browser into the
      # current directory, not the puppeteer cache the resolver looks in.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/cft" > "$RUNNER_TEMP/cft.log"
          cat "$RUNNER_TEMP/cft.log"
          bin=$(ls -d "$RUNNER_TEMP"/cft/chrome/*/chrome-linux64/chrome | tail -1)
          test -x "$bin" || { echo "::error::Chrome for Testing not found"; exit 1; }
          "$bin" --version
          echo "chrome-path=$bin" >> "$GITHUB_OUTPUT"

      - name: Verify scripts are executable
        # GNOME custom shortcuts exec copyurl.sh directly; a lost exec bit has
        # broken the hotkey in the field before.
        run: |
          for f in Linux/copyurl.sh scripts/run_tests.sh \
                   tests/linux/run_copyurl_unit.sh Mac/check_live_sync.sh; do
            if [ ! -x "$f" ]; then echo "::error file=$f::not executable"; exit 1; fi
          done

      # SKIPs on Linux (no ~/.hammerspoon/init.lua); see issue #4 for running it
      # on a macOS runner. Invoked anyway so the script is smoke-tested.
      - name: macOS live-config drift check (SKIP expected here)
        run: Mac/check_live_sync.sh

      - name: Run tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          COPYURL_LOG_FILE: ${{ runner.temp }}/copyurl_log.txt
        run: bash scripts/run_tests.sh

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copyurl-test-logs
          path: |
            ${{ runner.temp }}/copyurl_log.txt
            /tmp/cu_mac_diff.txt
          if-no-files-found: ignore
          retention-days: 7
